---
# Gateway / platform settings for infra.aap_configuration (AAP 2.5+).
# Replace host and secrets for your cluster (extra-vars, vault, or CI variables).

aap_hostname: "https://REPLACE_WITH_YOUR_AAP_HOST"
aap_validate_certs: false
aap_username: admin
aap_password: "{{ vault_aap_admin_password }}"
users_default_password: "{{ vault_users_default_password | default('ChangeMe123!') }}"

rh_certified_token: "{{ vault_rh_certified_token }}"

# Organizations (from aap-export/export/Tech Days + Default)
aap_organizations:
  - name: Tech Days
    description: Tech Days automation workshop content (AWS, Terraform, Git)
    max_hosts: 0
    galaxy_credentials:
      - "Ansible Galaxy"
      - "Red Hat Published"
      - "Red Hat Verified"

# Optional local users (adjust or remove if you use SSO only)
aap_user_accounts:
  - username: techdays_infra
    password: "{{ users_default_password }}"
    first_name: Tech
    last_name: Days Infra
    email: techdays-infra@example.com
    organization: "Tech Days"

aap_teams:
  - name: Admins
    description: Tech Days administrators
    organization: "Tech Days"
  - name: Operators
    description: Tech Days operators
    organization: "Tech Days"
