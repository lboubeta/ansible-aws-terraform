---
# Controller objects for infra.aap_configuration — consolidated from
# aap-export/export/Tech Days (and ORGANIZATIONLESS Tech Days Machine + APD AAP Credential pattern).
#
# Load vars/cloud.yml (or similar) before this file if you use Terraform/S3 backend lookups.
# Set aap_hostname to your platform URL (same value as gateway.yml) for AAP Credential.host.
# Omit or replace workflow until job templates exist; the exported WF referenced Demo Job Template.

### Roles (teams must exist via gateway.yml aap_teams) ###
controller_roles:
  - role: admin
    users:
      - admin
      - techdays_infra
    target_team: Admins
  - role: member
    users:
      - techdays_infra
    target_team: Operators

### Projects ###
controller_projects:
  - name: AWS Terraform
    organization: Tech Days
    description: AWS + Terraform + Git automation (ansible-aws-terraform)
    scm_type: git
    scm_url: https://github.com/lboubeta/ansible-aws-terraform.git
    scm_branch: main
    scm_clean: false
    scm_delete_on_update: false
    scm_update_on_launch: false
    allow_override: false
  - name: Terraform Example
    organization: Tech Days
    description: Example Terraform layout (terraform-example)
    scm_type: git
    scm_url: https://github.com/lboubeta/terraform-example.git
    scm_branch: main
    scm_clean: false
    scm_delete_on_update: false
    scm_update_on_launch: false
    allow_override: false

### Inventories ###
controller_inventories:
  - name: Tech Days Inventory
    organization: Tech Days
    description: Dynamic inventory for Tech Days (EC2 + Terraform state)

### Hosts ###
controller_hosts:
  - name: localhost
    inventory: Tech Days Inventory
    description: Localhost for local-connection jobs
    enabled: true
    variables:
      ansible_connection: local

### Inventory sources ###
controller_inventory_sources:
  - name: AWS Instances
    description: EC2 dynamic inventory
    organization: Tech Days
    source: ec2
    inventory: Tech Days Inventory
    credential: AWS Tech Days
    update_on_launch: false
    overwrite: false

### Labels ###
controller_labels:
  - name: aws
    organization: Tech Days
  - name: techdays
    organization: Tech Days

### Credentials (no secrets in git — use vault / CI) ###
controller_credentials:
  - name: AWS Tech Days
    description: AWS API keys for Tech Days jobs and EC2 inventory
    credential_type: Amazon Web Services
    organization: Tech Days
    inputs:
      username: "{{ vault_aws_techdays_access_key }}"
      password: "{{ vault_aws_techdays_secret_key }}"
  - name: Tech Days Machine
    description: SSH key for Linux | Setup Initial Config on EC2 instances
    credential_type: Machine
    organization: Tech Days
    inputs:
      username: "{{ vault_techdays_machine_username | default('ec2-user') }}"
      ssh_key_data: "{{ vault_techdays_machine_ssh_key_data }}"
  - name: Terraform Backend - S3 state
    description: S3 remote state for Terraform (optional; job templates may use env from AWS credential)
    organization: Tech Days
    credential_type: Terraform backend configuration
    inputs:
      configuration: |
        bucket = "{{ backend_s3_bucket }}"
        key = "{{ backend_s3_key }}"
        region = "{{ backend_region }}"
        access_key = "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID', default='') }}"
        secret_key = "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY', default='') }}"

### Execution environments (images must exist on your cluster / registry) ###
controller_execution_environments:
  - name: Terraform EE
    image: "{{ vault_ee_terraform_image | default('quay.io/ansible/ansible-runner:latest') }}"

### Job templates (inventory unified on Tech Days Inventory; export had Demo Inventory) ###
controller_templates:
  - name: AWS | Create S3 Bucket
    organization: Tech Days
    project: AWS Terraform
    inventory: Tech Days Inventory
    playbook: playbooks/create-s3-bucket.yml
    job_type: run
    credentials:
      - AWS Tech Days
    labels:
      - aws
      - techdays
    use_fact_cache: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - variable: bucket_name
          question_name: Bucket Name
          type: text
          required: true
          default: techday-tfstate-bucket
        - variable: region
          question_name: Region
          type: multiplechoice
          required: true
          choices:
            - eu-west-1
          default: eu-west-1

  - name: AWS | Deploy VMs
    organization: Tech Days
    project: AWS Terraform
    inventory: Tech Days Inventory
    playbook: playbooks/deploy-cloud-vms.yml
    job_type: run
    labels:
      - aws
      - techdays

  - name: TF | Apply Plan
    organization: Tech Days
    project: AWS Terraform
    inventory: Tech Days Inventory
    playbook: playbooks/tf-apply-plan.yml
    job_type: run
    credentials:
      - AWS Tech Days
    execution_environment: Terraform EE
    labels:
      - techdays
    use_fact_cache: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - variable: infrastructure_state
          question_name: Apply or Destroy?
          type: multiplechoice
          required: false
          choices:
            - present
            - absent
          default: present
        - variable: project_name
          question_name: Project Name
          type: text
          required: true
          default: awesome-app
        - variable: github_owner
          question_name: Owner
          type: text
          required: true
          default: lboubeta

  - name: GIT | Create Repo
    organization: Tech Days
    project: AWS Terraform
    inventory: Tech Days Inventory
    playbook: playbooks/git-create-repo.yml
    job_type: run
    labels:
      - techdays
    use_fact_cache: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - variable: github_owner
          question_name: Owner
          type: text
          required: true
          default: lboubeta
        - variable: github_token
          question_name: Personal Access Token
          type: password
          required: true
        - variable: github_repo_description
          question_name: Repo Description
          type: text
          required: false
        - variable: github_repo_private
          question_name: Private repo?
          type: multiplechoice
          required: true
          choices:
            - "true"
            - "false"
          default: "false"
        - variable: github_default_branch
          question_name: Default Branch
          type: text
          required: true
          default: main

  - name: GIT | Create TF Plan & Push
    organization: Tech Days
    project: AWS Terraform
    inventory: Tech Days Inventory
    playbook: playbooks/git-sync-tf-repo.yml
    job_type: run
    execution_environment: Product Demos EE
    labels:
      - techdays
    use_fact_cache: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - variable: project_name
          question_name: Project Name
          type: text
          required: true
          default: perfect-app
        - variable: github_owner
          question_name: Owner
          type: text
          required: true
          default: lboubeta
        - variable: github_token
          question_name: Personal Access Token
          type: password
          required: true
        - variable: github_repo_description
          question_name: Repo Description
          type: text
          required: false
        - variable: github_default_branch
          question_name: Default Branch
          type: text
          required: true
          default: main
        - variable: name_prefix
          question_name: Name Prefix
          type: text
          required: true
          default: techdays
        - variable: type
          question_name: Type
          type: multiplechoice
          required: true
          choices:
            - linux
            - windows
          default: linux
        - variable: aws_region
          question_name: Region
          type: multiplechoice
          required: true
          choices:
            - eu-west-1
            - eu-west-2
            - us-east-1
            - us-east-2
            - eu-north-1
          default: eu-west-1
        - variable: vm_count
          question_name: Number of VMs
          type: integer
          required: true
          default: 1
        - variable: instance_type
          question_name: Instance Type
          type: multiplechoice
          required: true
          choices:
            - t3.micro
            - t3.small
            - t3.medium
            - t3.large
            - t3.xlarge
          default: t3.medium

  - name: TF | Create Project Inventory Source
    organization: Tech Days
    project: AWS Terraform
    inventory: Tech Days Inventory
    playbook: playbooks/aap-create-inventory.yml
    job_type: run
    credentials:
      - AAP Credential
      - AWS Tech Days
    execution_environment: Product Demos EE
    labels:
      - techdays
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - variable: project_name
          question_name: Project Name
          type: text
          required: true
          default: perfect-app
    extra_vars:
      project_name: perfect-app

  - name: Linux | Setup Initial Config
    organization: Tech Days
    project: AWS Terraform
    inventory: Tech Days Inventory
    playbook: playbooks/day_0.yml
    job_type: run
    credentials:
      - Tech Days Machine
    execution_environment: Default execution environment
    labels:
      - techdays
    become_enabled: true

# Workflow uses stable string identifiers (infra.aap_configuration simplified_workflow_nodes).
# success_nodes / failure_nodes reference those identifiers only — not controller-generated UUIDs.

controller_workflows:
  - name: WF | Deploy Terraform Infrastructure in AWS
    description: Sync project, approval, S3 + Git paths converging to TF plan/apply, inventory, Linux day-0
    organization: Tech Days
    # Set true once if this workflow already exists with an old UUID-based node layout and CaC fails to reconcile.
    destroy_current_nodes: false
    allow_simultaneous: false
    ask_variables_on_launch: false
    ask_inventory_on_launch: false
    ask_limit_on_launch: false
    scm_branch: ""
    limit: ""
    webhook_service: ""
    extra_vars: ""
    labels:
      - techdays
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - variable: github_owner
          question_name: Github Repo Owner
          type: text
          required: true
          default: lboubeta
          min: 0
          max: 1024
          new_question: true
        - variable: github_token
          question_name: Github Personal Access Token
          type: password
          required: true
          min: 1
          max: 1024
          new_question: true
        - variable: project_name
          question_name: Project Name
          type: text
          required: true
          default: awesome-app
          min: 0
          max: 1024
          new_question: true
        - variable: type
          question_name: OS Type
          type: multiplechoice
          required: true
          choices:
            - linux
            - windows
          default: linux
          min: 0
          max: 1024
          new_question: false
        - variable: aws_region
          question_name: AWS Region
          type: multiplechoice
          required: true
          choices:
            - eu-west-1
            - eu-west-2
          default: eu-west-1
          min: 0
          max: 1024
          new_question: true
        - variable: vm_count
          question_name: Number of VMs
          type: integer
          required: true
          default: 1
          min: 1
          max: 4
          new_question: true
        - variable: instance_type
          question_name: Instance Type
          type: multiplechoice
          required: true
          choices:
            - t3.micro
            - t3.small
            - t3.medium
            - t3.large
          default: t3.medium
          min: 0
          max: 1024
          new_question: true
    simplified_workflow_nodes:
      - identifier: wf_sync_aws_terraform
        organization: Tech Days
        unified_job_template: AWS Terraform
        all_parents_must_converge: false
        success_nodes:
          - wf_approval_cost

      - identifier: wf_approval_cost
        organization: Tech Days
        approval_node:
          name: Cost Estimation Approval
          description: ""
          timeout: 0
        all_parents_must_converge: false
        success_nodes:
          - wf_create_s3_bucket
          - wf_git_create_repo

      - identifier: wf_create_s3_bucket
        organization: Tech Days
        unified_job_template: AWS | Create S3 Bucket
        all_parents_must_converge: false
        extra_data:
          bucket_name: lboubeta-tfstate-bucket
          region: eu-west-1
        success_nodes:
          - wf_git_tf_plan_push

      - identifier: wf_git_create_repo
        organization: Tech Days
        unified_job_template: GIT | Create Repo
        all_parents_must_converge: false
        extra_data:
          github_owner: lboubeta
          github_repo_private: "false"
          github_default_branch: main
          github_repo_name: techday-test
        success_nodes:
          - wf_git_tf_plan_push

      - identifier: wf_git_tf_plan_push
        organization: Tech Days
        unified_job_template: GIT | Create TF Plan & Push
        all_parents_must_converge: true
        extra_data:
          github_owner: lboubeta
          github_repo_name: techday-test
          github_default_branch: main
          name_prefix: techdays
          type: linux
          aws_region: eu-west-1
          vm_count: "1"
          instance_type: t3.medium
        success_nodes:
          - wf_tf_apply_plan

      - identifier: wf_tf_apply_plan
        organization: Tech Days
        unified_job_template: TF | Apply Plan
        all_parents_must_converge: false
        extra_data:
          plan_repo_url: https://github.com/lboubeta/techday-test
          infrastructure_state: present
          backend_s3_bucket: wintest-tfstate-bucket
          backend_region: eu-west-1
          backend_s3_key: terraform.tfstate
        success_nodes:
          - wf_create_inventory_source

      - identifier: wf_create_inventory_source
        organization: Tech Days
        unified_job_template: TF | Create Project Inventory Source
        all_parents_must_converge: false
        success_nodes:
          - wf_linux_setup_initial

      - identifier: wf_linux_setup_initial
        organization: Tech Days
        unified_job_template: Linux | Setup Initial Config
        limit: awesome-app
        all_parents_must_converge: false
        success_nodes: []