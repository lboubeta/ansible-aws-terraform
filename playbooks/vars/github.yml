---
# GitHub repository settings (non-secrets). Do not store tokens here — use Vault or -e / env.
# Token: ansible-playbook ... -e github_token=ghp_xxx  or  export GITHUB_TOKEN=ghp_xxx

github_api_url: "https://api.github.com"
# Host used in HTTPS clone URLs (change for GitHub Enterprise), e.g. github.com or github.mycompany.com
github_web_host: "github.com"

# Repository namespace: GitHub username or organization name
github_owner: "your-github-user-or-org"
github_repo_name: "my-terraform-repo"
github_repo_description: "Terraform generated from Ansible templates"
# false = public repository; true = private (must serialize as JSON boolean — see git-create-repo.yml body)
github_repo_private: false
github_default_branch: "main"
# Initial README commit (GitHub API auto_init)
github_init_with_readme: true

# true  -> POST /orgs/{github_owner}/repos
# false -> POST /user/repos (repo is created for the authenticated user; github_owner should match that user for clone URLs)
github_is_org: false

# Local clone path (under the playbook directory by default)
terraform_workspace: "{{ playbook_dir }}/worktrees/{{ github_repo_name }}"

# Git identity for commits from automation (override in Vault / extra vars if needed)
git_commit_user_name: "Ansible Automation"
git_commit_user_email: "ansible@example.com"
